services:

  redis:
    image: redis:latest
    container_name: redis

  db:
    image: mysql:8.0.36
    platform: linux/amd64
    volumes:
      - mysql_data:/var/lib/mysql
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prueba_uno
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: uv run celery -A app.core.celery_app worker --concurrency=5 -n worker1 --loglevel=info
    container_name: celery_app
    depends_on:
      - redis
      - db
    env_file:
      - .env

  web:
    build: .
    env_file:
      - .env
    container_name: prueba_uno_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  mysql_data: